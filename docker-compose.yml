services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fph
      POSTGRES_DB: fph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?défini dans .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    # Aucun port publié : la base n'est joignable que par le serveur.
  server:
    build: ./server
    env_file: .env
    environment:
      FPH_DATABASE_URL: postgresql+psycopg://fph:${POSTGRES_PASSWORD}@db:5432/fph
      FPH_STORAGE_DIR: /data/storage
    # TLS : monter le dossier des certificats et définir FPH_TLS_CERT/FPH_TLS_KEY dans .env
    #   (ex. FPH_TLS_CERT=/certs/server.pem). Voir docs/TLS_GUIDE.md
    volumes: [storage:/data/storage, "./certs:/certs:ro"]
    depends_on: [db]
    # Réseau local : remplacer par "0.0.0.0:8000:8000" ET placer un proxy TLS devant (voir docs/LAN_GUIDE.md)
    ports: ["127.0.0.1:8000:8000"]
  pwa:
    build: ./pwa
    environment:
      FPH_API_URL: http://server:8000
      PORT: 5000
    depends_on: [server]
    # Expose behind the same HTTPS proxy as the API in production.
    ports: ["127.0.0.1:5000:5000"]
  worker:
    build: ./server
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      FPH_DATABASE_URL: postgresql+psycopg://fph:${POSTGRES_PASSWORD}@db:5432/fph
    depends_on: [db, server]
  discovery:               # annonce le serveur sur le LAN (UDP 50505). Démarrer avec : --profile local
    build: ./server
    command: ["python", "-m", "app.discovery"]
    env_file: .env
    network_mode: host     # le broadcast UDP ne traverse pas le réseau Docker en mode bridge
    profiles: ["local"]
volumes:
  pgdata:
  storage:
