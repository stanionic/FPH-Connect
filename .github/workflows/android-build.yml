name: Android beta build

# Produit un APK de debug (build « beta ») sur un runner Linux hébergé.
# buildozer/python-for-android ne tournent que sous Linux/macOS : c'est le seul endroit
# où ce dépôt peut générer l'APK (la machine de dev est sous Windows, sans SDK/NDK).
on:
  workflow_dispatch:
  push:
    paths:
      - "client/**"
      - ".github/workflows/android-build.yml"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git openssh-client curl wget zip unzip tzdata file \
            autoconf libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev patchelf ccache \
            python3-all-dev python3-virtualenv

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "Cython>=3.0,<3.1" virtualenv
          pip install buildozer

      # python-for-android REFUSE de démarrer si l'identité git n'est pas définie
      # ("You must set git user.name and user.email") : c'était l'échec instantané (1m37s,
      # avant tout téléchargement SDK/NDK). On la pose globalement pour le runner.
      - name: Configure git identity (required by python-for-android)
        run: |
          git config --global user.email "builder@fph.local"
          git config --global user.name "FPH CI Builder"

      # buildozer télécharge et gère lui-même le SDK/NDK Android sous .buildozer/.
      # On capture la sortie dans build.log et, en cas d'échec, on publie la dernière ligne
      # d'erreur en ANNOTATION (visible sans login) + le log complet en artefact, car GitHub
      # exige désormais une connexion pour lire les logs bruts.
      - name: Build debug (beta) APK
        run: |
          set +e
          buildozer --verbose android debug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            err=$(grep -iE "error|exception|must set|traceback|not found|failed" build.log | tail -n 3 | tr '\n' ' ' | sed 's/%/%%/g')
            echo "::error::buildozer android debug failed (exit $status). Last: ${err:-see uploaded build.log}"
            exit "$status"
          fi

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: client/build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fph-connect-beta-apk
          path: client/bin/*.apk
          if-no-files-found: error
